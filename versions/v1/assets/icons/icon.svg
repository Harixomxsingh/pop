<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141f2a"/>
      <stop offset="60%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <radialGradient id="sageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#88c0a8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#88c0a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#88c0a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7d8c4"/>
      <stop offset="100%" stop-color="#4d7c6b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="url(#sageGlow)"/>

  <!-- Concentric Calming Ripples -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#88c0a8" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#88c0a8" stroke-width="4" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="70" fill="url(#ringGrad)" opacity="0.95"/>
  
  <!-- Inner Clarity Core -->
  <circle cx="256" cy="256" r="28" fill="#f8fafc"/>
  <circle cx="256" cy="256" r="12" fill="#07090e"/>
</svg>
