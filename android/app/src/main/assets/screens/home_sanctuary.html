<script>
  (function initSanctuaryInteractions() {
    const pebble = document.getElementById('core-pebble');
    const ambientRing = document.getElementById('ambient-ring');
    const stateLabel = document.getElementById('state-label');
    const stateSub = document.getElementById('state-sub');
    const centerIcon = document.getElementById('center-icon');
    const orbital = document.getElementById('pulse-orbital');
    const beginBtn = document.getElementById('begin-trigger');

    let isBreathing = false;
    let breathTimer = null;
    let phase = 0; // 0: Inhale, 1: Hold, 2: Exhale

    const phases = [
      { text: "Inhale", sub: "4 SECONDS", scale: "scale-105", ringScale: "scale-125", opacity: "0.8" },
      { text: "Hold", sub: "4 SECONDS", scale: "scale-105", ringScale: "scale-125", opacity: "0.9" },
      { text: "Exhale", sub: "6 SECONDS", scale: "scale-95", ringScale: "scale-90", opacity: "0.3" }
    ];

    function toggleBreathing() {
      isBreathing = !isBreathing;
      if (isBreathing) {
        stateLabel.textContent = "Inhale";
        stateSub.textContent = "DEEP SOMATIC";
        centerIcon.textContent = "waves";
        orbital.setAttribute('class', 'text-secondary/70 transition-all duration-1000');
        cycleBreath();
      } else {
        clearTimeout(breathTimer);
        stateLabel.textContent = "Ready";
        stateSub.textContent = "TAP TO SYNC";
        centerIcon.textContent = "spa";
        pebble.style.transform = 'scale(1)';
        ambientRing.style.transform = 'scale(1)';
        orbital.setAttribute('class', 'text-primary/30 transition-all duration-700');
      }
    }

    function cycleBreath() {
      if (!isBreathing) return;
      const current = phases[phase];
      stateLabel.textContent = current.text;
      stateSub.textContent = current.sub;
      
      if (phase === 0) {
        pebble.style.transform = 'scale(1.06)';
        ambientRing.style.transform = 'scale(1.35)';
        ambientRing.style.opacity = '0.9';
      } else if (phase === 2) {
        pebble.style.transform = 'scale(0.96)';
        ambientRing.style.transform = 'scale(0.85)';
        ambientRing.style.opacity = '0.3';
      }

      const durations = [4000, 4000, 6000];
      const duration = durations[phase];
      phase = (phase + 1) % phases.length;
      breathTimer = setTimeout(cycleBreath, duration);
    }

    if (pebble) {
      pebble.addEventListener('click', toggleBreathing);
      pebble.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleBreathing();
        }
      });
    }

    if (beginBtn) {
      beginBtn.addEventListener('click', () => {
        if (!isBreathing) {
          toggleBreathing();
        }
      });
    }

    // Modal quick pill feedback
    const quickPills = document.querySelectorAll('.quick-pill');
    quickPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        quickPills.forEach(p => p.classList.remove('bg-surface-container-high/90'));
        pill.classList.add('bg-surface-container-high/90');
        if (!isBreathing) toggleBreathing();
      });
    });
  })();
