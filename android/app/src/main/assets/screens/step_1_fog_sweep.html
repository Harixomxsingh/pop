<script>
  (function() {
    // Fog Sweep Interactive Canvas
    const canvas = document.getElementById('fog-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('touch-hint');
    let isDrawing = false;
    let clearedCount = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      drawFog();
    }

    function drawFog() {
      ctx.save();
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;

      // Base fog layer with soft bioluminescent gradient
      const grad = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, Math.max(w, h));
      grad.addColorStop(0, '#232b35');
      grad.addColorStop(0.65, '#18202a');
      grad.addColorStop(1, '#141c26');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Micro cloud particles
      ctx.fillStyle = 'rgba(153, 212, 247, 0.08)';
      for (let i = 0; i < 40; i++) {
        const x = (Math.sin(i * 99) * 0.5 + 0.5) * w;
        const y = (Math.cos(i * 33) * 0.5 + 0.5) * h;
        const r = 24 + (i % 5) * 14;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function sweep(x, y) {
      if (hint && !hint.classList.contains('opacity-0')) {
        hint.classList.add('opacity-0');
      }
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      const rad = 42 * window.devicePixelRatio;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(0.5, 'rgba(0,0,0,0.8)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      clearedCount++;
      if (clearedCount === 25) {
        const primaryBtn = document.getElementById('continue-trigger');
        if (primaryBtn) {
          primaryBtn.classList.remove('shadow-[0_0_24px_rgba(126,184,218,0.25)]');
          primaryBtn.classList.add('shadow-[0_0_36px_rgba(126,184,218,0.45)]');
        }
      }
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * window.devicePixelRatio,
        y: (clientY - rect.top) * window.devicePixelRatio
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const { x, y } = getCoords(e);
      sweep(x, y);
    });
    window.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const { x, y } = getCoords(e);
      sweep(x, y);
    });

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      const { x, y } = getCoords(e);
      sweep(x, y);
    }, { passive: true });
    window.addEventListener('touchend', () => { isDrawing = false; });
    canvas.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      const { x, y } = getCoords(e);
      sweep(x, y);
    }, { passive: true });

    window.addEventListener('resize', resize);
    setTimeout(resize, 60);

    // Pill Selector Behavior
    const pills = document.querySelectorAll('.mood-pill');
    const stateLabel = document.getElementById('selected-state-label');

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => {
          p.classList.remove('active', 'bg-surface-container-highest', 'shadow-[0_0_16px_rgba(126,184,218,0.2)]');
          p.classList.add('bg-surface-container');
        });
        pill.classList.remove('bg-surface-container');
        pill.classList.add('active', 'bg-surface-container-highest', 'shadow-[0_0_16px_rgba(126,184,218,0.2)]');
        
        if (stateLabel) {
          const mood = pill.getAttribute('data-state');
          stateLabel.textContent = mood ? mood.charAt(0).toUpperCase() + mood.slice(1) : 'Logged';
          stateLabel.classList.remove('opacity-0');
        }
      });
    });

    // Default select first pill smoothly
    if (pills[0]) pills[0].click();
  })();
</script></main><script src="nav.js"></script></body></html>
