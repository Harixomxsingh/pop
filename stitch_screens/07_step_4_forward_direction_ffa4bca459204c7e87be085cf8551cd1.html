<script>
  (function () {
    const cards = document.querySelectorAll('.space-card');
    const continueBtn = document.getElementById('continueBtn');
    let selectedSlug = null;

    cards.forEach(card => {
      card.addEventListener('click', () => {
        const slug = card.getAttribute('data-slug');
        
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-surface-container-high', 'shadow-[0_0_24px_rgba(154,210,186,0.18)]');
          c.classList.add('bg-surface-container-low');
          const indicator = c.querySelector('.selection-indicator');
          if (indicator) {
            indicator.classList.remove('opacity-100', 'scale-100');
            indicator.classList.add('opacity-0', 'scale-75');
          }
        });

        // Activate Selected Card
        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface-container-low');
        card.classList.add('bg-surface-container-high', 'shadow-[0_0_24px_rgba(154,210,186,0.18)]');
        
        const activeIndicator = card.querySelector('.selection-indicator');
        if (activeIndicator) {
          activeIndicator.classList.remove('opacity-0', 'scale-75');
          activeIndicator.classList.add('opacity-100', 'scale-100');
        }

        selectedSlug = slug;

        // Unlock Primary Continue Action
        continueBtn.removeAttribute('disabled');
        continueBtn.classList.remove('bg-surface-container-highest', 'text-outline', 'cursor-not-allowed');
        continueBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-[0_0_24px_rgba(126,184,218,0.25)]', 'active:scale-98', 'cursor-pointer');
      });
    });

    continueBtn.addEventListener('click', () => {
      if (!selectedSlug) return;
      // Visual feedback pulse
      continueBtn.classList.add('scale-95');
      setTimeout(() => {
        continueBtn.classList.remove('scale-95');
      }, 150);
    });
  })();
