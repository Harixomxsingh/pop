  </head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.25)]"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><div class="flex flex-col"><span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Pop</span><h1 class="font-headline-sm text-headline-sm text-on-surface leading-none">Active Protocol Step</h1></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 w-full bg-surface pt-16 pb-safe"><div class="flex flex-col w-full px-margin-mobile pb-space-lg select-none">

</div>
<div class="w-2.5 h-2.5 rounded-full bg-secondary flex items-center justify-center">

</div>
<div class="w-6 h-2.5 rounded-full bg-primary-container shadow-[0_0_16px_rgba(126,184,218,0.45)]"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
</div>
<span class="font-label-sm text-label-sm text-outline tracking-widest uppercase">Protocol Stage 03 of 07</span>
</div>
<!-- Header Text: Radical Calm -->
<div class="flex flex-col items-center text-center space-y-1 mb-space-md">

<!-- Mindfulness Respiration Orb Engine -->
<div class="relative w-full aspect-square max-w-[320px] mx-auto flex items-center justify-center my-space-xs">
<!-- Ambient Bioluminescent Floor Aura -->
<div class="absolute inset-4 rounded-full bg-secondary/15 blur-3xl transition-all duration-1000 ease-out transform scale-90" id="orb-ambient"></div>
<!-- Concentric Bloom Ring Outer -->

<!-- Concentric Bloom Ring Mid -->
<div class="absolute inset-12 rounded-full bg-secondary/20 transition-all duration-500 ease-out transform scale-80 opacity-60" id="ring-mid"></div>
<!-- Core Resonant Capsule -->
<div class="relative z-10 w-44 h-44 rounded-full bg-gradient-to-tr from-secondary-container/90 via-surface-container-high/80 to-secondary/30 backdrop-blur-2xl shadow-[0_0_40px_rgba(136,192,168,0.22)] flex flex-col items-center justify-center transition-all duration-700 ease-out transform scale-95" id="ring-core">
<!-- Secondary Specular Arc -->
<div class="absolute inset-0 rounded-full bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
<!-- Live Instructional HUD -->
<span class="font-headline-sm text-headline-sm text-secondary tracking-normal font-medium drop-shadow-sm transition-opacity duration-300" id="breath-cue">Inhale</span>
<div class="flex items-baseline mt-0.5">
<span class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tighter" id="breath-timer">3</span>

</div>
</div>

</div>
<!-- Somatic Tri-Phase Rhythm Segment Matrix -->
<div class="w-full max-w-[340px] mx-auto grid grid-cols-3 gap-1.5 p-1.5 rounded-full bg-surface-container-low mb-space-lg shadow-inner">
<div class="flex flex-col items-center justify-center py-2 px-1 rounded-full bg-surface-container text-secondary shadow-[0_0_12px_rgba(154,210,186,0.15)] transition-all duration-300" id="pill-phase-1">
<span class="font-label-sm text-label-sm uppercase tracking-wider opacity-80">Primary</span>
<span class="font-label-md text-label-md font-semibold">Inhale 3s</span>
</div>
<div class="flex flex-col items-center justify-center py-2 px-1 rounded-full bg-transparent text-outline transition-all duration-300" id="pill-phase-2">

<span class="font-label-md text-label-md text-on-primary-container tracking-wider font-semibold uppercase">Continue</span>
<span class="material-symbols-outlined text-on-primary-container text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Bio-Telemetry Context Sub-card -->
<div class="w-full max-w-[340px] mx-auto mt-space-md p-space-sm rounded-lg bg-surface-container-lowest/60 flex items-center gap-space-sm">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[18px]">favorite</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-snug">Autonomous collapse of alveolar sacks triggers vagal brake down-regulation.</p>
</div>
</div>
<script>
  (() => {
    const cueEl = document.getElementById('breath-cue');
    const timerEl = document.getElementById('breath-timer');
    const ambientEl = document.getElementById('orb-ambient');
    const ringOuter = document.getElementById('ring-outer');
    const ringMid = document.getElementById('ring-mid');
    const ringCore = document.getElementById('ring-core');
    const p1 = document.getElementById('pill-phase-1');
    const p2 = document.getElementById('pill-phase-2');
    const p3 = document.getElementById('pill-phase-3');
    const cycleTracker = document.getElementById('cycle-tracker');

    let currentCycle = 2;
    const totalCycles = 5;

    // Physiological sigh sequence: Inhale (3s), Micro top-up (1s), Long Exhale (6s)
    const phases = [
      { name: 'Inhale', duration: 3, scale: 1.15, pill: p1, glow: '0.4' },
      { name: 'Top-up', duration: 1, scale: 1.25, pill: p2, glow: '0.55' },
      { name: 'Exhale', duration: 6, scale: 0.85, pill: p3, glow: '0.15' }
    ];

    let phaseIndex = 0;
    let secondsRemaining = phases[0].duration;

    function setPhaseUI(phase) {
      cueEl.textContent = phase.name;
      
      // Update Pills
      [p1, p2, p3].forEach(p => {
        p.classList.remove('bg-surface-container', 'text-secondary', 'shadow-[0_0_12px_rgba(154,210,186,0.15)]');
        p.classList.add('bg-transparent', 'text-outline');
      });

      phase.pill.classList.remove('bg-transparent', 'text-outline');
      phase.pill.classList.add('bg-surface-container', 'text-secondary', 'shadow-[0_0_12px_rgba(154,210,186,0.15)]');

      // Dynamic Scale & Transform
      ringCore.style.transform = `scale(${phase.scale})`;
      ringMid.style.transform = `scale(${phase.scale * 1.1})`;
      ringOuter.style.transform = `scale(${phase.scale * 1.25})`;
      ambientEl.style.transform = `scale(${phase.scale * 1.2})`;
      ambientEl.style.opacity = phase.glow;
    }

    setPhaseUI(phases[0]);

    setInterval(() => {
      secondsRemaining--;
      if (secondsRemaining <= 0) {
        phaseIndex = (phaseIndex + 1) % phases.length;
        if (phaseIndex === 0) {
          currentCycle = currentCycle >= totalCycles ? 1 : currentCycle + 1;
          cycleTracker.textContent = `Cycle ${currentCycle} of ${totalCycles}`;
        }
        const active = phases[phaseIndex];
        secondsRemaining = active.duration;
        setPhaseUI(active);
      }
      timerEl.textContent = secondsRemaining;
    }, 1000);
  })();
</script></main></body></html>
