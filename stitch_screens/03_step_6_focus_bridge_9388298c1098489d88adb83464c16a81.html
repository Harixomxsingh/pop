</button>

<span class="material-symbols-outlined text-[22px] text-outline transition-colors">volume_off</span>

<span class="material-symbols-outlined text-[26px]" id="play-pause-icon">pause</span>

<span class="font-label-md text-label-md font-semibold tracking-wide">Complete Bridge</span>
<div class="flex items-center gap-1">

</div>
</button>

<script>
  let secondsRemaining = 272; // 04:32
  let isRunning = true;
  let timerInterval = null;
  const initialSeconds = 300; // 5 min base
  const circumference = 2 * Math.PI * 108; // ~678.58

  function formatTime(totalSeconds) {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function updateDisplay() {
    const display = document.getElementById('countdown-display');
    const ring = document.getElementById('timer-progress-ring');
    if (display) display.textContent = formatTime(secondsRemaining);

    if (ring) {
      const progressFraction = (initialSeconds - secondsRemaining) / initialSeconds;
      const offset = circumference * (1 - Math.min(Math.max(progressFraction, 0), 1));
      ring.style.strokeDashoffset = offset;
    }
  }

  function toggleTimer() {
    const icon = document.getElementById('play-pause-icon');
    isRunning = !isRunning;
    if (isRunning) {
      if (icon) icon.textContent = 'pause';
      startTicker();
    } else {
      if (icon) icon.textContent = 'play_arrow';
      clearInterval(timerInterval);
    }
  }

  function startTicker() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (secondsRemaining > 0) {
        secondsRemaining--;
        updateDisplay();
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        const icon = document.getElementById('play-pause-icon');
        if (icon) icon.textContent = 'replay';
      }
    }, 1000);
  }

  function selectSound(btn, label) {
    const buttons = document.querySelectorAll('.sound-btn');
    buttons.forEach((b) => {
      b.classList.remove('bg-surface-container-high', 'shadow-[0_0_20px_-4px_rgba(126,184,218,0.25)]');
      b.classList.add('bg-surface-container-low');
      const icon = b.querySelector('.material-symbols-outlined');
      const text = b.querySelector('span:last-child');
      if (icon) {
        icon.classList.remove('text-primary');
        icon.classList.add('text-outline');
      }
      if (text) {
        text.classList.remove('text-on-surface');
        text.classList.add('text-on-surface-variant');
      }
      b.setAttribute('data-active', 'false');
    });

    btn.classList.remove('bg-surface-container-low');
    btn.classList.add('bg-surface-container-high', 'shadow-[0_0_20px_-4px_rgba(126,184,218,0.25)]');
    const activeIcon = btn.querySelector('.material-symbols-outlined');
    const activeText = btn.querySelector('span:last-child');
    if (activeIcon) {
      activeIcon.classList.remove('text-outline');
      activeIcon.classList.add('text-primary');
    }
    if (activeText) {
      activeText.classList.remove('text-on-surface-variant');
      activeText.classList.add('text-on-surface');
    }
    btn.setAttribute('data-active', 'true');

    const status = document.getElementById('soundscape-status');
    if (status) status.textContent = label;
  }

  function finishBridge() {
    const display = document.getElementById('countdown-display');
    if (display) {
      display.classList.add('text-secondary');
      display.textContent = 'RESTORED';
    }
    setTimeout(() => {
      window.location.hash = '#step-07';
    }, 450);
  }

  startTicker();
</script></main></body></html>
