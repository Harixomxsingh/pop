  </head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.25)]"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><div class="flex flex-col"><span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">Pop</span><h1 class="font-headline-sm text-headline-sm text-on-surface leading-none">Active Protocol Step</h1></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 w-full bg-surface pt-16 pb-safe"><div class="flex flex-col w-full px-margin-mobile pb-space-lg select-none">

<!-- Central Visual: Minimalist Celestial Telemetry Ring -->
<div class="relative flex flex-col items-center justify-center my-space-sm">
<!-- Ambient Bioluminescent Glow Backdrop -->
<div class="absolute w-64 h-64 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
<!-- Radial Progress Track -->

<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 256 256">
<!-- Inactive Perimeter Rail -->
<circle class="text-surface-container-high" cx="128" cy="128" fill="none" r="110" stroke="currentColor" stroke-width="2"></circle>
<!-- Active Glowing Ice-Blue Arc -->
<circle class="transition-all duration-1000 ease-linear drop-shadow-[0_0_10px_rgba(126,184,218,0.7)]" cx="128" cy="128" fill="none" id="horizon-timer-ring" r="110" stroke="#7eb8da" stroke-dasharray="691.15" stroke-dashoffset="0" stroke-linecap="round" stroke-width="2.5"></circle>
</svg>
<!-- Center Telemetry Display -->
<div class="absolute flex flex-col items-center justify-center text-center">

        </span>

<span>Done early</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full py-2.5 rounded-full text-outline font-label-md text-label-md hover:text-on-surface transition-colors text-center" id="pause-toggle-btn" type="button">
      Pause interval
    </button>
</div>
</div>
<script>
  (() => {
    let timeLeft = 45;
    const initialTime = 45;
    const circumference = 2 * Math.PI * 110;
    let isPaused = false;

    const timerRing = document.getElementById('horizon-timer-ring');
    const countdownEl = document.getElementById('countdown-text');
    const pauseBtn = document.getElementById('pause-toggle-btn');
    const advanceBtn = document.getElementById('advance-btn');

    if (!timerRing || !countdownEl) return;

    const updateDisplay = () => {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      countdownEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      const offset = circumference - (timeLeft / initialTime) * circumference;
      timerRing.style.strokeDashoffset = `${offset}`;

      if (timeLeft === 0) {
        countdownEl.classList.add('text-secondary');
        if (advanceBtn) {
          advanceBtn.innerHTML = '<span>Proceed</span><span class="material-symbols-outlined text-[18px]">check</span>';
          advanceBtn.classList.add('bg-secondary', 'text-on-secondary');
          advanceBtn.classList.remove('bg-primary-container', 'text-on-primary');
        }
      }
    };

    const ticker = setInterval(() => {
      if (!isPaused && timeLeft > 0) {
        timeLeft -= 1;
        updateDisplay();
      } else if (timeLeft <= 0) {
        clearInterval(ticker);
      }
    }, 1000);

    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? 'Resume countdown' : 'Pause interval';
      });
    }

    if (advanceBtn) {
      advanceBtn.addEventListener('click', () => {
        timeLeft = 0;
        updateDisplay();
      });
    }

    updateDisplay();
  })();
</script></main></body></html>
